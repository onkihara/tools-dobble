server {
    listen 80;
    server_name apps.blikk.it;

    root /var/www;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location = /favicon.ico {
        root /var/www;
        access_log off;
        log_not_found off;
    }

    error_page 418 = @tool_front_controller;

    location ~ ^/[^/]+/(?:.*/)?\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~* ^/[^/]+/.*\.php(?:/|$) {
        deny all;
    }

    location ~ ^/(?<tool>[a-zA-Z0-9_-]+)$ {
        return 308 /$tool/$is_args$args;
    }

    location ~ ^/(?<tool>[a-zA-Z0-9_-]+)(?:/.*)?$ {
        set $tool_root /var/www/$tool/public;
        rewrite ^/[^/]+(?:/(.*))?$ /$1 break;
        root $tool_root;
        if (-d $request_filename) {
            return 418;
        }
        try_files $uri @tool_front_controller;
    }

    location @tool_front_controller {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $tool_root/index.php;
        fastcgi_param SCRIPT_NAME /$tool/index.php;
        fastcgi_param DOCUMENT_ROOT $tool_root;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location / {
        return 404;
    }
}
